name: Build backend

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pf
          POSTGRES_PASSWORD: pf
          POSTGRES_DB: pf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pf:pf@localhost:5432/pf
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run pytest

      - name: Compute image name and tags
        id: meta
        # GHCR rejects uppercase repo/owner names, but github.repository preserves
        # the GitHub-display casing (SartoRiccardo/...) - lowercase it explicitly.
        # On a tag push (e.g. "1.0.0", no "v" prefix) the image gets tagged with
        # that exact tag name; otherwise (push to main) it gets latest + the sha.
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$IMAGE:$GITHUB_REF_NAME"
            else
              echo "$IMAGE:latest"
              echo "$IMAGE:$GITHUB_SHA"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
